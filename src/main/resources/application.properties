main.datasource.url=jdbc:mariadb://127.0.0.1:3306/IMS
main.datasource.username=root
main.datasource.password=
main.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.database-platform=io.jmix.eclipselink.impl.dbms.JmixMySQLPlatform
jmix.data.dbms-type=mariadb

main.liquibase.change-log=com/ghazal/ims2/liquibase/changelog.xml

jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.menu-config=com/ghazal/ims2/menu.xml
jmix.ui.composite-menu=true

ui.login.defaultUsername=admin
ui.login.defaultPassword=admin

jmix.core.available-locales=en,ar
vaadin.launch-browser=false
logging.level.org.atmosphere=warn
logging.level.eclipselink.logging.sql=info
logging.level.io.jmix.core.datastore=info
logging.level.io.jmix.core.AccessLogger=debug
logging.level.io.jmix=info
logging.level.org.springframework.security=info

jmix.liquibase.contexts=base,security
server.port=80